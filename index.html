<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#222b50">
<title>Programação Cogera</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Programação">
<style>
  :root{--navy:#222b50;--green:#04a458;--bg:#f3f5f9;--txt:#1d2433;--muted:#667085}
  @media (prefers-color-scheme:dark){:root{--bg:#12151d;--txt:#e7e9ee;--muted:#9aa3b2}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
  .tela{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:var(--bg);z-index:5}
  .tela.on{display:flex}
  .tela img{width:96px;height:96px;border-radius:22px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
  .tela h1{font-size:20px;margin:0}
  .tela p{margin:0;color:var(--muted);max-width:340px}
  .gira{width:28px;height:28px;border:3px solid rgba(4,164,88,.25);border-top-color:var(--green);border-radius:50%;animation:g 1s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  input{width:100%;max-width:360px;padding:12px;border-radius:10px;border:1px solid #c9ced8;font:inherit;background:#fff;color:#1d2433}
  button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;cursor:pointer}
  .prim{background:var(--green);color:#fff}
  #instalar{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:6;display:none;background:var(--navy);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.3)}
  #offline{position:fixed;left:0;right:0;top:0;z-index:7;display:none;background:#b42318;color:#fff;font-size:14px;padding:8px 12px;text-align:center;padding-top:calc(8px + env(safe-area-inset-top))}
  #erro{color:#b42318;font-size:14px;min-height:1em}
</style>
</head>
<body>
<div id="offline">Sem internet — a programação aparece de novo quando a conexão voltar.</div>

<div class="tela on" id="carregando">
  <img src="icon-192.png" alt="Cogera">
  <div class="gira"></div>
  <p>Carregando sua programação…</p>
</div>

<div class="tela" id="semLink">
  <img src="icon-192.png" alt="Cogera">
  <h1>Programação Cogera</h1>
  <p>Abra pelo link que o programador mandou no WhatsApp, ou cole o link aqui:</p>
  <input id="colar" type="url" placeholder="Cole aqui o seu link" autocomplete="off">
  <button class="prim" id="entrar">Entrar</button>
  <div id="erro"></div>
</div>

<iframe id="app" title="Minha programação" allow="clipboard-write" hidden></iframe>
<button id="instalar">📲 Instalar app</button>

<script>
(function(){
  'use strict';
  var CHAVE = 'cogera-programacao';
  var $ = function(id){ return document.getElementById(id); };

  function ler(){ try { return JSON.parse(localStorage.getItem(CHAVE)) || null; } catch(e){ return null; } }
  function gravar(c){ try { localStorage.setItem(CHAVE, JSON.stringify(c)); } catch(e){} }

  // Aceita o link do app (…github.io/…?s=ID&t=TOKEN) ou o link antigo do Apps Script (…/macros/s/ID/exec?t=TOKEN)
  function extrair(txt){
    try {
      var u = new URL(String(txt).trim());
      var t = u.searchParams.get('t');
      var s = u.searchParams.get('s');
      var m = u.pathname.match(/\/macros\/s\/([^/]+)\/exec/);
      if (!s && m) s = m[1];
      if (s && t && /^[\w-]+$/.test(s) && /^[\w-]+$/.test(t)) return { s: s, t: t };
    } catch(e){}
    return null;
  }

  var cfg = extrair(location.href);
  if (cfg) {
    gravar(cfg);
    // deixa o endereço limpo (o app instalado sempre abre em ./)
    try { history.replaceState(null, '', location.pathname); } catch(e){}
  } else {
    cfg = ler();
  }

  var frame = $('app');
  var ultimaCarga = 0;

  function abrir(){
    if (!cfg) { $('carregando').classList.remove('on'); $('semLink').classList.add('on'); return; }
    $('semLink').classList.remove('on');
    $('carregando').classList.add('on');
    frame.hidden = false;
    frame.src = 'https://script.google.com/macros/s/' + encodeURIComponent(cfg.s) +
                '/exec?t=' + encodeURIComponent(cfg.t) + '&app=1&_=' + Date.now();
    ultimaCarga = Date.now();
  }

  frame.addEventListener('load', function(){ if (frame.src) $('carregando').classList.remove('on'); });

  $('entrar').addEventListener('click', function(){
    var c = extrair($('colar').value);
    if (!c) { $('erro').textContent = 'Esse link não parece ser o da programação. Confira e cole de novo.'; return; }
    $('erro').textContent = '';
    cfg = c; gravar(c); abrir();
  });

  // Botão "Atualizar" da página do técnico
  window.addEventListener('message', function(ev){
    if (ev.data === 'cogera-recarregar') abrir();
  });

  // Voltou para o app depois de um tempo: recarrega para pegar mudanças
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && cfg && Date.now() - ultimaCarga > 10 * 60 * 1000) abrir();
  });

  function rede(){ $('offline').style.display = navigator.onLine ? 'none' : 'block'; }
  window.addEventListener('online', function(){ rede(); if (cfg) abrir(); });
  window.addEventListener('offline', rede);
  rede();

  // Botão de instalar (Android/Chrome)
  var pedido = null;
  window.addEventListener('beforeinstallprompt', function(ev){
    ev.preventDefault(); pedido = ev; $('instalar').style.display = 'block';
  });
  $('instalar').addEventListener('click', function(){
    if (!pedido) return;
    pedido.prompt();
    pedido.userChoice.then(function(){ pedido = null; $('instalar').style.display = 'none'; });
  });
  window.addEventListener('appinstalled', function(){ $('instalar').style.display = 'none'; });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }

  abrir();
})();
</script>
</body>
</html>
